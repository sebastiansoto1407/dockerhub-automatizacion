name: Deploy pagin estatica en pages

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        

      - name: Configurar Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen de Dockerhub
        uses: docker/build-push-action@v5
        with:
          context:
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mi-web-plana:latest
            ${{ secrets.DOCKER_USERNAME }}/mi-web-plana:${{ github.sha }}